[package]
name = "slint-demos"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# the rp2040 uses the software renderer, Path elements need an extra feature there
slint = { version = "1.19.0", features = ["software-renderer-path"] }

[build-dependencies]
slint-build = "1.19.0"

# Slint and zeno from the local forks (next to slint-demos), the same as in the firmwares
[patch.crates-io]
slint = { path = "../slint/api/rs/slint" }
slint-build = { path = "../slint/api/rs/build" }
zeno = { path = "../zeno" }

[profile.release]
codegen-units = 1
lto = true
