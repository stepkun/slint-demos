[package]
name = "instruments-firmware"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[dependencies]
cortex-m = "0.7"
cortex-m-rt = "0.7"
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread"] }
# intrinsics: integer division by the hardware divider and float operations by the
# optimized routines in the RP2040 boot ROM, instead of the slow generic software versions
embassy-rp = { version = "0.10", features = ["rp2040", "time-driver", "critical-section-impl", "intrinsics", "rom-func-cache"] }
embassy-time = "0.5"
embedded-alloc = "0.7"
embedded-hal = "1"
embedded-hal-bus = "0.3"
mipidsi = "0.10"
slint = { version = "1.18.1", default-features = false, features = ["compat-1-2", "unsafe-single-threaded", "libm", "renderer-software", "software-renderer-path"] }

[build-dependencies]
slint-build = "1.18.1"

# Slint 1.18.1 does not compile for no_std with the `software-renderer-path` feature
# (f32::rem_euclid in graphics/path.rs), the vendored copy contains a one-line fix.
# Remove this once a fixed Slint release is available.
# The patched crates are in firmware/vendor, shared by all firmwares and tools/host-check, see
# firmware/vendor/README.md.
[patch.crates-io]
i-slint-core = { path = "../../vendor/i-slint-core" }
# zeno 0.3.3 (path rasterizer of the software renderer) keeps about 18 KB on the stack,
# which overflows into the frame buffer, the vendored copy uses heap storage instead
zeno = { path = "../../vendor/zeno" }
# software renderer 1.18.1 with fixes and speed-ups for MCUs, see README.md:
# paths only blended in the redrawn region (partial redraw bug), path masks in bands of limited
# size, strokes converted to outlines once, coverage scaling without divisions
i-slint-renderer-software = { path = "../../vendor/i-slint-renderer-software" }
