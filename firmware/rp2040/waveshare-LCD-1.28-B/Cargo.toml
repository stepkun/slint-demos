[package]
name = "instruments-firmware-lcd-1-28"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[dependencies]
cortex-m = "0.7"
cortex-m-rt = "0.7"
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread"] }
# intrinsics: integer division by the hardware divider and float operations by the
# optimized routines in the RP2040 boot ROM, instead of the slow generic software versions
embassy-rp = { version = "0.10", features = ["rp2040", "time-driver", "critical-section-impl", "intrinsics", "rom-func-cache"] }
embassy-time = "0.5"
embedded-alloc = "0.7"
embedded-hal = "1"
embedded-hal-bus = "0.3"
mipidsi = "0.10"
slint = { version = "1.19.0", default-features = false, features = ["compat-1-2", "unsafe-single-threaded", "libm", "renderer-software", "software-renderer-path"] }

[build-dependencies]
slint-build = "1.19.0"

# Slint and zeno from the local forks (next to slint-demos), with the patches for MCUs:
# software renderer with paths only blended in the redrawn region (partial redraw bug), path
# masks in bands of limited size and kept path buffers, zeno with heap storage instead of
# about 18 KB on the stack. Keep the same in all firmwares and tools/host-check.
[patch.crates-io]
slint = { path = "../../../../slint/api/rs/slint" }
slint-build = { path = "../../../../slint/api/rs/build" }
zeno = { path = "../../../../zeno" }
