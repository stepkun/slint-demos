[build]
target = "thumbv8m.main-none-eabihf"    # Cortex-M33 with FPU of the RP2350

[target.thumbv8m.main-none-eabihf]
# hold BOOTSEL while plugging in the Pico 2, then `cargo run --release` loads the firmware with
# picotool (elf2uf2-rs doesn't know the RP2350)
runner = "picotool load -u -v -x -t elf"
rustflags = [
    "-C", "link-arg=--nmagic",
    "-C", "link-arg=-Tlink.x",
]
