# Builds and checks every crate of the repository, each has its own workspace and target dir

name: CI

on:
  push:
  pull_request:

# a newer push to the same branch or pull request makes the older run obsolete
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # the static dial paths in ui/*.slint are generated, a changed generator or hand-edited
  # paths must be regenerated, and no static box may overlap a hand
  dial-paths:
    name: generated dial paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: tools/dial-paths.py --check
        if: hashFiles('tools/dial-paths.py') != ''
        run: python3 tools/dial-paths.py --check

  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    # a hanging step fails instead of running for hours
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: desktop app
            dir: .
            # std builds of Slint link against fontconfig, the desktop app also xkbcommon,
            # wayland and xcb
            packages: pkg-config libfontconfig-dev libxkbcommon-dev libwayland-dev libxcb-shape0-dev libxcb-xfixes0-dev
            build: cargo build --release
          - name: firmware
            dir: firmware/rp2040/waveshare-ResTouch-LCD-2.8
            # the target thumbv6m-none-eabi comes from .cargo/config.toml of the firmware
            target: thumbv6m-none-eabi
            build: cargo build --release
          - name: host check
            dir: tools/host-check
            # 32-bit like the RP2040, the target comes from .cargo/config.toml of the host check
            target: i686-unknown-linux-gnu
            packages: gcc-multilib
            # built first, so a hang shows whether it is the build or the check itself
            build: cargo build --release && timeout 300 cargo run --release -- --png last-frame.png
            artifact: last-frame.png
          - name: web demo
            dir: web
            # the target comes from .cargo/config.toml of the web demo; wasm-pack and the
            # deployment are in pages.yml
            target: wasm32-unknown-unknown
            build: cargo build --release
          - name: partial redraw repro
            dir: issues/rp2040/partial-redraw-path
            packages: pkg-config libfontconfig-dev libxkbcommon-dev libwayland-dev libxcb-shape0-dev libxcb-xfixes0-dev
            build: cargo build --release
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v5

      # tools/host-check is not on every branch
      - name: Check that the crate exists
        id: crate
        working-directory: .
        run: |
          if [ -f "${{ matrix.dir }}/Cargo.toml" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::${{ matrix.dir }} not found, skipped"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install system packages
        if: steps.crate.outputs.present == 'true' && matrix.packages
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ matrix.packages }}

      - name: Install Rust
        if: steps.crate.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      # cargo registry and the crate's own target dir
      - name: Cache
        if: steps.crate.outputs.present == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.dir }} -> target
          key: ${{ matrix.name }}

      - name: cargo fmt --check
        if: steps.crate.outputs.present == 'true'
        run: cargo fmt --check

      - name: cargo clippy
        if: steps.crate.outputs.present == 'true'
        run: cargo clippy --release -- -D warnings

      - name: Build
        if: steps.crate.outputs.present == 'true'
        run: ${{ matrix.build }}

      - name: Upload the last frame
        if: steps.crate.outputs.present == 'true' && matrix.artifact && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: host-check-last-frame
          path: ${{ matrix.dir }}/${{ matrix.artifact }}
          if-no-files-found: ignore
