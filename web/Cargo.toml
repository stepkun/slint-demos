[package]
name = "web-demo"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

# The desktop app with all six instruments (ui/basic-panel.slint) as WebAssembly for the browser,
# built with wasm-pack, see README.md.
[lib]
crate-type = ["cdylib"]

[dependencies]
# the web backend of Slint (winit with a canvas), the same version as the desktop app
slint = "1.19.0"
wasm-bindgen = "0.2"
# std::time::Instant panics on wasm32-unknown-unknown, this one uses the browser clock
web-time = "1"

[build-dependencies]
slint-build = "1.19.0"
# the instruments, next to slint-demos
aircraft-gauges = { path = "../../aircraft-gauges" }

# own workspace, so the crate is not taken as part of the desktop app in the repository root
[workspace]

# Slint and zeno from the forks on GitHub (stepkun/slint branch patched, stepkun/zeno), the same
# as in the desktop app and the firmwares
[patch.crates-io]
slint = { git = "https://github.com/stepkun/slint", branch = "patched" }
slint-build = { git = "https://github.com/stepkun/slint", branch = "patched" }
zeno = { git = "https://github.com/stepkun/zeno", branch = "main" }

[profile.release]
# smaller download
opt-level = "s"
lto = true
codegen-units = 1
