<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Basic panel</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000000; color: #dddddd;
                 font-family: sans-serif; }
    main { display: flex; flex-direction: column; align-items: center; justify-content: center;
           min-height: 100%; gap: 12px; }
    canvas { outline: none; }
    p { margin: 0; font-size: 14px; }
    a { color: #dddddd; }
  </style>
</head>
<body>
  <main>
    <!-- Slint draws the window into the canvas with this id, in its preferred size -->
    <canvas id="canvas" data-slint-auto-resize-to-preferred="true" unselectable="on"></canvas>
    <p id="status">Loading the instruments …</p>
  </main>
  <script type="module">
    // built by wasm-pack into pkg/, see README.md
    import init, { basic_panel } from "./pkg/web_demo.js";
    const status = document.getElementById("status");
    const started = () => {
      status.innerHTML = 'Six basic flight instruments with demo values, built with ' +
        '<a href="https://slint.dev">Slint</a>. The same as a ' +
        '<a href="combined.html">combined display</a>.';
    };
    init().then(() => basic_panel()).then(started, (error) => {
      // the event loop of the web backend ends the start function with an exception on
      // purpose, it keeps running in the browser: that is a successful start
      if (String(error).includes("Using exceptions for control flow")) {
        started();
      } else {
        status.textContent = "The instruments could not be started: " + error;
        console.error(error);
      }
    });
  </script>
</body>
</html>
